<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body {font-family:Arial, Helvetica, sans-serif; padding: 20px; border-radius: 8px; width: 350px; margin: auto; justify-content: center; display: flex;}
    
    .theForm {background: rgb(255, 255, 255); padding: 25px; }

    input, select {display: block; margin: 10px; width: 100%; padding: 8px;}

    button {width: 100%; padding: 12px; background-color: rgb(92, 124, 200); cursor: pointer; border-radius: 12px;}

    .star {font-size: 28px; color:rgb(194, 194, 194); cursor: pointer;}
    .star.active {color: rgb(215, 195, 84);}

    #listItems {padding: 0; list-style: none;}

    .movie-entry {border: 1px solid; padding: 15px; border-radius: 6px; margin-top: 10px; position: relative;}

    .delete-btn {color: rgb(174, 174, 174); border: none; cursor: pointer;}

</style>
<body>
    <div class="theForm">
        <h1> Add A Movie </h1>
        <form id="movieForm">
        <label> Title: </label>
        <input type="text" id="title" required>
        <label> Year: </label>
        <input type="number" id="year" required>
        <label> Genre: </label>
        <select id="genre">
            <option value="Action">Action</option>
            <option value="Romance">Romance</option>
            <option value="Horror">Horror</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
        </select>

        <label> Rating: </label>
        <div id="rating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>

        <button type="submit">Add Movie</button>
    </form>

    <div id="movieList">
        <h1> Movie List </h1>
        <ul id="listItems"></ul>
    </div>
</div>

<script>
    const movieForm = document.getElementById("movieForm");
    const listItems = document.getElementById("listItems");
    const movieList = document.getElementById("movieList");
    let currentRating = 0;
    const stars = document.querySelectorAll(".star");

    stars.forEach((star, index) => {
        star.addEventListener("click", function () {
            currentRating = index + 1;
            updateStars(currentRating);
            });
        });

    function updateStars(val) {
        stars.forEach((s, i) => {
            s.classList.toggle("active", i < val);
        });
    }

    movieForm.addEventListener("submit", function (e)  {
        e.preventDefault();

        const titleInput = document.getElementById("title").value;
        const yearInput =  document.getElementById("year").value;
        const genreInput = document.getElementById("genre").value;

    let movies = JSON.parse(localStorage.getItem("movies")) || [];

    const doesMovieExist = movies.findIndex(m => m.title.toLowerCase() === title.toLowerCase());

    if (doesMovieExist !== -1) {
            const oldRating = Number(movies[doesMovieExist].rating);
            const newRating = (oldRating + currentRating) / 2;
            movies[doesMovieExist].year = yearInput;
            movies[doesMovieExist].genre = genreInput;
            movies[doesMovieExist].rating = Math.round(newRating);
        } else {

    movies.push({

        title: titleInput,
        year: yearInput,
        genre: genreInput,
        rating: currentRating
    });
        }

    localStorage.setItem("movies", JSON.stringify(movies));

    movieForm.reset();
    currentRating = 0;
    updateStars(0);
    displayMovies();

});

    function deleteMovies(index) {
        if(confirm("Are you sure you want to delete?")) {
            let movies = JSON.parse(localStorage.getItem("movies")) || [];
            movies.splice(index, 1);
            localStorage.setItem("movies", JSON.stringify(movies));
            displayMovies();
        }
    }

    function displayMovies() {
        listItems.innerHTML = "";
        let movies = JSON.parse(localStorage.getItem("movies")) || [];

        movies.forEach(movie => {
            const li = document.createElement("li");
            li.className = "movie-entry";

            li.innerHTML = `
            <strong>${movie.title}</strong><br>
            Year: ${movie.year}<br>
            Genre: ${movie.genre}<br>
            Rating: ${"★".repeat(movie.rating)}
            <button class="delete-btn" onclick="deleteMovies(${index})">Delete</button>
            `;

            listItems.appendChild(li);
        });
    }
    displayMovies();
    </script>
    </body>
    </html>
